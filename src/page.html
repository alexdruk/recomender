<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book recommendations</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #22201c; --soft: #6d675d; --line: #e2dccf;
    --accent: #2f6f4f; --like: #2f6f4f; --dislike: #a2452f; --warn-bg: #fff1cf; --warn-ink: #6b4a00; --chip: #ece7da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a17; --card: #25231f; --ink: #ece8df; --soft: #a39c8e; --line: #3a372f;
      --accent: #7fc8a0; --like: #4f9a74; --dislike: #c26a52; --warn-bg: #4a3a10; --warn-ink: #ffe3a1; --chip: #34312a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; }
  h2 { font-size: 19px; margin: 32px 0 4px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--soft); font-size: 14px; margin: 10px 0 0; }
  .status b { color: var(--ink); font-weight: 600; }
  .busy { color: var(--accent); font-size: 14px; margin: 6px 0 0; min-height: 21px; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; margin: 14px 0 0; font-size: 14px; }
  .hint { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
  .hint input { width: 58px; font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 12px 0; }
  .author { color: var(--soft); font-size: 14px; }
  .title { font-size: 19px; font-weight: 650; margin: 2px 0 4px; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .series { font-size: 14px; margin-bottom: 6px; }
  .series span { color: var(--soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 13px; }
  .chip.score { background: none; border: 1px solid var(--accent); color: var(--accent); font-variant-numeric: tabular-nums; }
  .ann { margin: 8px 0; font-size: 15px; overflow-wrap: anywhere; }
  .ann.short { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .more { color: var(--accent); font-size: 14px; cursor: pointer; background: none; border: 0; padding: 0; }
  .near { color: var(--soft); font-size: 14px; margin: 8px 0 0; }
  .near ul { margin: 2px 0 0; padding-left: 18px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .like { background: var(--like); border-color: var(--like); color: #fff; }
  .dislike { background: none; border-color: var(--dislike); color: var(--dislike); }
  .row a { margin-left: auto; color: var(--accent); font-size: 14px; }
  .empty { color: var(--soft); padding: 18px 0; }
  #showRest { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font-size: 16px; text-decoration: underline; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Book recommendations</h1>
    <button id="check">Check now</button>
  </header>
  <p class="status" id="status">Loading ...</p>
  <p class="busy" id="busy"></p>
  <div id="warnings"></div>

  <h2>Recommended</h2>
  <p class="hint">New books whose score is in the top <input id="top" type="number" min="0.5" max="100" step="0.5"> % of all books scored so far, best first.</p>
  <div id="recommended"></div>

  <button id="showRest"></button>
  <div id="restBlock" hidden>
    <h2 id="restTitle"></h2>
    <div id="rest"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let showRest = false;
let wasBusy = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function when(iso) {
  if (!iso) return 'never';
  return new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

async function api(url, body) {
  const res = await fetch(url, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'the request failed');
  return res.json();
}

function card(b) {
  const box = el('div', 'card');
  box.append(el('div', 'author', b.authors || 'Author not given'));
  const title = el('div', 'title');
  const a = el('a', null, b.title || 'No title');
  a.href = b.link; a.target = '_blank'; a.rel = 'noopener';
  title.append(a);
  box.append(title);
  if (b.series) {
    const s = el('div', 'series', `Series: ${b.series}${b.seriesNo ? ', book ' + b.seriesNo : ''}`);
    if (b.seriesNote) s.append(el('span', null, ` (${b.seriesNote})`));
    box.append(s);
  }
  const chips = el('div', 'chips');
  chips.append(el('span', 'chip score', `score ${b.score.toFixed(2)} · top ${b.percentile < 10 ? b.percentile.toFixed(1) : Math.round(b.percentile)}%`));
  for (const g of b.genres) chips.append(el('span', 'chip', g));
  chips.append(el('span', 'chip', `${Math.round(b.words / 1000).toLocaleString()} thousand words`));
  if (b.translated) chips.append(el('span', 'chip', 'translated'));
  box.append(chips);
  if (b.annotation) {
    const ann = el('div', 'ann short', b.annotation);
    box.append(ann);
    if (b.annotation.length > 450) {
      const more = el('button', 'more', 'Show all');
      more.onclick = () => { more.textContent = ann.classList.toggle('short') ? 'Show all' : 'Show less'; };
      box.append(more);
    }
  } else {
    box.append(el('div', 'ann author', 'The file has no annotation.'));
  }
  if (b.closest.length) {
    const near = el('div', 'near', 'Closest by text among the books I liked:');
    const ul = el('ul');
    for (const n of b.closest) ul.append(el('li', null, `${n.authors ? n.authors + ' — ' : ''}${n.title}`));
    near.append(ul);
    box.append(near);
  }
  const row = el('div', 'row');
  for (const [answer, label] of [['like', 'Like'], ['dislike', 'Dislike']]) {
    const btn = el('button', answer, label);
    btn.onclick = async () => {
      row.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      try {
        await api('/api/answer', { key: b.key, answer });
        box.remove();
        load();
      } catch (e) {
        alert('Could not save the answer: ' + e.message);
        row.querySelectorAll('button').forEach((x) => { x.disabled = false; });
      }
    };
    row.append(btn);
  }
  const link = el('a', null, 'Open the book page');
  link.href = b.link; link.target = '_blank'; link.rel = 'noopener';
  row.append(link);
  box.append(row);
  return box;
}

function fill(node, books, emptyText) {
  node.replaceChildren(...(books.length ? books.map(card) : [el('div', 'empty', emptyText)]));
}

function render(s) {
  const st = s.status;
  const m = st.model;
  const quality = m
    ? `model quality <b>AUC ${m.auc.toFixed(3)}</b>, <b>${(100 * m.top5).toFixed(0)}%</b> of liked books in the top 5% (trained ${when(m.trained_at)})`
    : 'no trained model yet';
  $('status').innerHTML = `Last download <b>${when(st.lastDownload)}</b> · last check ${when(st.lastCheck && st.lastCheck.time)} · ` +
    `<b>${st.analysed}</b> books analysed · <b>${st.passed}</b> passed the filters · <b>${st.answers}</b> answers given (${st.likes} likes) · ${quality}`;

  $('busy').textContent = s.busy ? s.busy + ' ...' + (s.waiting.length ? ' Next: ' + s.waiting.join(', ').toLowerCase() + '.' : '')
    : `The model retrains after every ${s.retrainEvery} answers; ${s.retrainEvery - st.sinceTraining} to go.`;
  $('check').disabled = !!s.busy && s.busy.startsWith('Checking');

  const warnings = [];
  if (st.lastCheck && st.lastCheck.error) warnings.push('The last check could not download new files: ' + st.lastCheck.error.split('\n')[0]);
  for (const g of s.gaps) {
    warnings.push(`Some update files were missed: book ids ${g.from} to ${g.to} (${g.to - g.from + 1} ids) left the listing before they were downloaded. ${g.why || ''}`);
  }
  $('warnings').replaceChildren(...warnings.map((w) => el('div', 'warn', w)));

  if (document.activeElement !== $('top')) $('top').value = s.top;
  fill($('recommended'), s.recommended, 'Nothing new in the top right now. Press "Check now", or look at the rest below.');
  $('showRest').textContent = showRest ? 'Hide the rest' : `Show the rest (${s.rest.length} more books from the last ${s.restDays} days)`;
  $('restBlock').hidden = !showRest;
  $('restTitle').textContent = `The rest of the last ${s.restDays} days`;
  if (showRest) fill($('rest'), s.rest, 'No other books.');
}

async function load() {
  try {
    const s = await api('/api/state');
    const y = window.scrollY;
    render(s);
    window.scrollTo(0, y);
    wasBusy = !!s.busy;
  } catch (e) {
    $('busy').textContent = 'The server does not answer. Is "npm start" running?';
  }
}

$('check').onclick = async () => { $('check').disabled = true; await api('/api/check', {}); load(); };
$('showRest').onclick = () => { showRest = !showRest; load(); };
$('top').onchange = async () => {
  try { await api('/api/settings', { top: Number($('top').value) }); } catch (e) { alert(e.message); }
  load();
};

load();
// while the server is working, look again every few seconds; otherwise once a minute
setInterval(() => { if (wasBusy) load(); }, 4000);
setInterval(load, 60000);
</script>
</body>
</html>
