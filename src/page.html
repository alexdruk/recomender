<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book recommendations</title>
<!--
  This page must run in Safari 9 on an old iPad (iOS 9.3). Rules:
  - script: ES5 only. No arrow functions, let, const, template strings,
    fetch, promises, async or await. Use var, function and XMLHttpRequest.
  - style: no CSS grid, no CSS variables, no "gap". Use flexbox and margins.
  "npm run check-page" checks these rules.
-->
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #f6f4ef; color: #22201c; font: 17px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { display: block; max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0 12px 8px 0; }
  h2 { font-size: 20px; margin: 32px 0 4px; }
  a { color: #2f6f4f; }
  button, .btn {
    display: inline-block; font: inherit; font-size: 17px; line-height: 24px; cursor: pointer; text-align: center; text-decoration: none;
    min-height: 48px; padding: 11px 20px; border-radius: 10px; border: 1px solid #e2dccf; background: #fffdf8; color: #22201c;
    -webkit-appearance: none; -webkit-tap-highlight-color: rgba(0, 0, 0, .1);
  }
  button:disabled { opacity: .5; cursor: default; }
  nav { margin: 0 0 8px; }
  nav .btn { margin: 0 8px 8px 0; padding: 11px 14px; }
  nav .btn span { color: #6d675d; font-weight: 400; }
  nav .btn.here { background: #ece7da; font-weight: 600; }
  .status { color: #6d675d; font-size: 15px; margin: 10px 0 0; }
  .status b { color: #22201c; font-weight: 600; }
  .busy { color: #2f6f4f; font-size: 15px; margin: 6px 0 0; min-height: 22px; }
  .warn { background: #fff1cf; color: #6b4a00; border-radius: 8px; padding: 10px 14px; margin: 14px 0 0; font-size: 15px; }
  .hint { color: #6d675d; font-size: 15px; margin: 0 0 12px; }
  .hint input { width: 76px; font: inherit; font-size: 17px; padding: 8px; border: 1px solid #e2dccf; border-radius: 8px; background: #fffdf8; color: #22201c; }
  .card { background: #fffdf8; border: 1px solid #e2dccf; border-radius: 12px; padding: 16px 18px; margin: 12px 0; }
  .author { color: #6d675d; font-size: 15px; }
  .title { font-size: 20px; font-weight: 600; margin: 2px 0 4px; }
  .title a { color: inherit; text-decoration: none; }
  .series { font-size: 15px; margin-bottom: 6px; }
  .series span { color: #6d675d; }
  .chips { margin: 6px 0 0; }
  .chip { display: inline-block; background: #ece7da; border-radius: 999px; padding: 1px 10px; font-size: 14px; margin: 0 6px 6px 0; }
  .chip.score { background: none; border: 1px solid #2f6f4f; color: #2f6f4f; }
  .ann { margin: 8px 0; font-size: 16px; word-wrap: break-word; }
  .ann.short { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  button.more { color: #2f6f4f; font-size: 15px; background: none; border: 0; padding: 11px 16px 11px 0; }
  .near { color: #6d675d; font-size: 15px; margin: 8px 0 0; }
  .near ul { margin: 2px 0 0; padding-left: 18px; }
  .row { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; margin-top: 8px; }
  .row button, .row .btn { margin: 8px 10px 0 0; }
  .like, .ibooks { background: #2f6f4f; border-color: #2f6f4f; color: #fff; }
  .row .big { font-size: 20px; font-weight: 600; padding: 15px 26px; min-height: 56px; }
  .row .small { font-size: 15px; min-height: 40px; padding: 7px 14px; }
  .prep { font-size: 14px; color: #6d675d; margin: 8px 10px 0 0; }
  .prep.ready { color: #2f6f4f; font-weight: 600; }
  .headrow { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; margin-top: 32px; }
  .headrow h2 { margin: 0 12px 4px 0; }
  .dislike { background: none; border-color: #a2452f; color: #a2452f; }
  .row .site { margin: 8px 0 0 auto; font-size: 15px; padding: 11px 0; }
  .when { color: #6d675d; font-size: 14px; }
  .empty { color: #6d675d; padding: 18px 0; }
  button#showRest { color: #2f6f4f; background: none; border: 0; padding: 11px 0; text-decoration: underline; margin-top: 20px; }

  @media (prefers-color-scheme: dark) {
    body { background: #1b1a17; color: #ece8df; }
    a { color: #7fc8a0; }
    button, .btn { border-color: #3a372f; background: #25231f; color: #ece8df; }
    nav .btn.here { background: #34312a; }
    .status, .hint, .author, .series span, .near, .when, .empty, .prep, nav .btn span { color: #a39c8e; }
    .prep.ready { color: #7fc8a0; }
    .status b { color: #ece8df; }
    .busy { color: #7fc8a0; }
    .warn { background: #4a3a10; color: #ffe3a1; }
    .hint input { border-color: #3a372f; background: #25231f; color: #ece8df; }
    .card { background: #25231f; border-color: #3a372f; }
    .chip { background: #34312a; }
    .chip.score { background: none; border-color: #7fc8a0; color: #7fc8a0; }
    button.more, button#showRest { color: #7fc8a0; background: none; }
    .like, .ibooks { background: #4f9a74; border-color: #4f9a74; color: #fff; }
    .dislike { background: none; border-color: #c26a52; color: #c26a52; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="heading">Book recommendations</h1>
    <button id="check">Check now</button>
  </header>
  <nav>
    <a class="btn" id="nav_home" href="/">Recommendations <span id="count_home"></span></a>
    <a class="btn" id="nav_tosend" href="/tosend">To send <span id="count_tosend"></span></a>
    <a class="btn" id="nav_reading" href="/reading">Reading <span id="count_reading"></span></a>
    <a class="btn" id="nav_liked" href="/liked">Liked <span id="count_liked"></span></a>
    <a class="btn" id="nav_disliked" href="/disliked">Disliked <span id="count_disliked"></span></a>
  </nav>

  <div id="homeView">
    <p class="status" id="status">Loading ...</p>
    <p class="busy" id="busy"></p>
    <div id="warnings"></div>

    <div class="headrow">
      <h2>Recommended</h2>
      <button id="addAll">Add all to send list</button>
    </div>
    <p class="hint">New books whose score is in the top <input id="top" type="number" min="0.5" max="100" step="0.5"> % of all books scored so far, best first.</p>
    <div id="recommended"></div>

    <button id="showRest"></button>
    <div id="restBlock" style="display: none">
      <h2 id="restTitle"></h2>
      <div id="rest"></div>
    </div>
  </div>

  <div id="listView" style="display: none">
    <p class="status" id="listStatus">Loading ...</p>
    <div id="list"></div>
  </div>
</main>

<script>
// ES5 only: this script also runs in Safari 9 on an old iPad.
// The same file is every page: "/" is the recommendations, the others are lists.
var LISTS = {
  tosend: { title: 'To send', make: toSendRow, empty: 'The waiting list is empty. Press "Add to send list" on the recommendations page.' },
  reading: { title: 'Reading', make: readingCard, empty: 'No books here. A book comes here when you press "Read in iBooks" on the page "To send".' },
  liked: { title: 'Liked books', make: answerCard, empty: 'No liked books yet.' },
  disliked: { title: 'Disliked books', make: answerCard, empty: 'No disliked books yet.' }
};
var view = window.location.pathname.replace(/^\/+|\/+$/g, '');
if (!LISTS.hasOwnProperty(view)) view = 'home';
var shown = []; // the recommended books on the screen now, best first
var showRest = false;
var wasBusy = false;
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function $(id) {
  return document.getElementById(id);
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.appendChild(document.createTextNode(String(text)));
  return e;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function two(n) {
  return n < 10 ? '0' + n : String(n);
}

// "14 Nov, 09:26"
function when(iso) {
  if (!iso) return 'never';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return 'unknown';
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + two(d.getHours()) + ':' + two(d.getMinutes());
}

// "1234567" -> "1,234,567"
function thousands(n) {
  return String(n).replace(/\B(?=(\d{3})+$)/g, ',');
}

// Asks the server. With "body" it is a POST. done(error, answer).
function api(url, body, done) {
  var xhr = new XMLHttpRequest();
  var finished = false;
  function finish(err, data) {
    if (finished) return;
    finished = true;
    done(err, data);
  }
  xhr.open(body ? 'POST' : 'GET', url, true);
  if (body) xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var data = null;
    try {
      data = JSON.parse(xhr.responseText);
    } catch (e) {
      data = null;
    }
    if (xhr.status >= 200 && xhr.status < 300 && data) finish(null, data);
    else if (xhr.status === 0) finish(new Error('the server does not answer'));
    else finish(new Error((data && data.error) || 'the request failed'));
  };
  xhr.onerror = function () {
    finish(new Error('the server does not answer'));
  };
  xhr.send(body ? JSON.stringify(body) : null);
}

function setDisabled(row, off) {
  var list = row.getElementsByTagName('button');
  for (var i = 0; i < list.length; i++) list[i].disabled = off;
}

// Runs one POST for a card: the buttons of the row are off while it runs,
// then the page is loaded again (the card is gone or has moved).
function act(row, url, body, what) {
  setDisabled(row, true);
  api(url, body, function (err) {
    if (err) {
      alert('Could not ' + what + ': ' + err.message);
      setDisabled(row, false);
      return;
    }
    load();
  });
}

function button(row, label, cls, url, body, what) {
  var btn = el('button', cls, label);
  btn.onclick = function () {
    act(row, url, body, what);
  };
  row.appendChild(btn);
  return btn;
}

function siteLink(row, b) {
  var link = el('a', 'site', 'Open the book page');
  link.href = b.link;
  link.target = '_blank';
  link.rel = 'noopener';
  row.appendChild(link);
}

// A link that gets the EPUB file: on the iPad Safari then offers "Open in iBooks".
function epubLink(row, b, label, cls) {
  var a = el('a', cls, label);
  a.href = '/epub/' + b.id;
  a.onclick = function () {
    // on a computer the file just downloads and the page stays: show the changed list
    setTimeout(load, 3000);
    setTimeout(load, 15000);
  };
  row.appendChild(a);
  return a;
}

// Author, title and series: the top of a card on the list pages.
function listCard(b) {
  var box = el('div', 'card');
  box.appendChild(el('div', 'author', b.authors || 'Author not given'));
  box.appendChild(el('div', 'title', b.title || 'No title'));
  if (b.series) box.appendChild(el('div', 'series', 'Series: ' + b.series + (b.seriesNo ? ', book ' + b.seriesNo : '')));
  return box;
}

function card(b) {
  var box = el('div', 'card');
  var i;
  box.appendChild(el('div', 'author', b.authors || 'Author not given'));
  var title = el('div', 'title');
  var a = el('a', null, b.title || 'No title');
  a.href = b.link;
  a.target = '_blank';
  a.rel = 'noopener';
  title.appendChild(a);
  box.appendChild(title);
  if (b.series) {
    var s = el('div', 'series', 'Series: ' + b.series + (b.seriesNo ? ', book ' + b.seriesNo : ''));
    if (b.seriesNote) s.appendChild(el('span', null, ' (' + b.seriesNote + ')'));
    box.appendChild(s);
  }
  var chips = el('div', 'chips');
  var pct = b.percentile < 10 ? b.percentile.toFixed(1) : String(Math.round(b.percentile));
  chips.appendChild(el('span', 'chip score', 'score ' + b.score.toFixed(2) + ' · top ' + pct + '%'));
  for (i = 0; i < b.genres.length; i++) chips.appendChild(el('span', 'chip', b.genres[i]));
  chips.appendChild(el('span', 'chip', thousands(Math.round(b.words / 1000)) + ' thousand words'));
  if (b.translated) chips.appendChild(el('span', 'chip', 'translated'));
  box.appendChild(chips);
  if (b.annotation) {
    var ann = el('div', 'ann short', b.annotation);
    box.appendChild(ann);
    if (b.annotation.length > 450) {
      var more = el('button', 'more', 'Show all');
      more.onclick = function () {
        var isShort = ann.className === 'ann short';
        ann.className = isShort ? 'ann' : 'ann short';
        clear(more);
        more.appendChild(document.createTextNode(isShort ? 'Show less' : 'Show all'));
      };
      box.appendChild(more);
    }
  } else {
    box.appendChild(el('div', 'ann author', 'The file has no annotation.'));
  }
  if (b.closest.length) {
    var near = el('div', 'near', 'Closest by text among the books I liked:');
    var ul = el('ul');
    for (i = 0; i < b.closest.length; i++) {
      var n = b.closest[i];
      ul.appendChild(el('li', null, (n.authors ? n.authors + ' — ' : '') + n.title));
    }
    near.appendChild(ul);
    box.appendChild(near);
  }
  var row = el('div', 'row');
  button(row, 'Add to send list', null, '/api/tosend', { key: b.key }, 'add the book to the send list');
  button(row, 'Like', 'like', '/api/answer', { key: b.key, answer: 'like' }, 'save the answer');
  button(row, 'Dislike', 'dislike', '/api/answer', { key: b.key, answer: 'dislike' }, 'save the answer');
  siteLink(row, b);
  box.appendChild(row);
  return box;
}

// One waiting book on the page "To send".
function toSendRow(b) {
  var box = listCard(b);
  var row = el('div', 'row');
  epubLink(row, b, 'Read in iBooks', 'btn ibooks big');
  var text = b.epub === 'ready' ? 'ready' : b.epub === 'failed' ? 'not prepared yet - a tap will fetch it' : 'preparing ...';
  row.appendChild(el('span', b.epub === 'ready' ? 'prep ready' : 'prep', text));
  button(row, 'Remove', 'small', '/api/unsend', { key: b.key }, 'remove the book');
  box.appendChild(row);
  return box;
}

// One sent book on the page "Reading": the verdict is given here, after reading.
function readingCard(b) {
  var box = listCard(b);
  box.appendChild(el('div', 'when', 'Sent to iBooks ' + when(b.time)));
  var row = el('div', 'row');
  button(row, 'Like', 'like', '/api/answer', { key: b.key, answer: 'like' }, 'save the answer');
  button(row, 'Dislike', 'dislike', '/api/answer', { key: b.key, answer: 'dislike' }, 'save the answer');
  epubLink(row, b, 'Send again', 'btn');
  siteLink(row, b);
  box.appendChild(row);
  return box;
}

// One answer on the pages "Liked" and "Disliked".
function answerCard(b) {
  var liked = view === 'liked';
  var box = listCard(b);
  box.appendChild(el('div', 'when', (liked ? 'Liked ' : 'Disliked ') + when(b.time) + (b.kind === 'read' ? ' · after reading' : ' · on a card, not read')));
  var row = el('div', 'row');
  if (liked) button(row, 'Change to Dislike', 'dislike', '/api/answer', { key: b.key, answer: 'dislike' }, 'change the answer');
  else button(row, 'Change to Like', 'like', '/api/answer', { key: b.key, answer: 'like' }, 'change the answer');
  button(row, 'Clear answer', null, '/api/clear', { key: b.key }, 'clear the answer');
  siteLink(row, b);
  box.appendChild(row);
  return box;
}

// The number of books beside each list name in the menu.
function showCounts(counts) {
  for (var name in counts) {
    if (!counts.hasOwnProperty(name) || !$('count_' + name)) continue;
    clear($('count_' + name));
    $('count_' + name).appendChild(document.createTextNode('(' + counts[name] + ')'));
  }
}

function fill(node, books, make, emptyText) {
  clear(node);
  if (!books.length) {
    node.appendChild(el('div', 'empty', emptyText));
    return;
  }
  for (var i = 0; i < books.length; i++) node.appendChild(make(books[i]));
}

function render(s) {
  var st = s.status;
  var m = st.model;
  var i;
  var quality = m
    ? 'model quality <b>AUC ' + m.auc.toFixed(3) + '</b>, <b>' + (100 * m.top5).toFixed(0) + '%</b> of liked books in the top 5% (trained ' + when(m.trained_at) + ')'
    : 'no trained model yet';
  $('status').innerHTML = 'Last download <b>' + when(st.lastDownload) + '</b> · last check ' + when(st.lastCheck && st.lastCheck.time) + ' · ' +
    '<b>' + st.analysed + '</b> books analysed · <b>' + st.passed + '</b> passed the filters · <b>' + st.answers + '</b> answers given (' + st.likes + ' likes) · ' + quality;

  var busyText = s.busy
    ? s.busy + ' ...' + (s.waiting.length ? ' Next: ' + s.waiting.join(', ').toLowerCase() + '.' : '')
    : 'The model retrains after every ' + s.retrainEvery + ' answers; ' + (s.retrainEvery - st.sinceTraining) + ' to go.';
  clear($('busy'));
  $('busy').appendChild(document.createTextNode(busyText));
  $('check').disabled = !!s.busy && s.busy.indexOf('Checking') === 0;

  var warnings = [];
  if (st.lastCheck && st.lastCheck.error) warnings.push('The last check could not download new files: ' + st.lastCheck.error.split('\n')[0]);
  for (i = 0; i < s.gaps.length; i++) {
    var g = s.gaps[i];
    warnings.push('Some update files were missed: book ids ' + g.from + ' to ' + g.to + ' (' + (g.to - g.from + 1) + ' ids) left the listing before they were downloaded. ' + (g.why || ''));
  }
  clear($('warnings'));
  for (i = 0; i < warnings.length; i++) $('warnings').appendChild(el('div', 'warn', warnings[i]));

  if (document.activeElement !== $('top')) $('top').value = s.top;
  shown = s.recommended;
  $('addAll').disabled = !shown.length;
  showCounts(s.counts);
  fill($('recommended'), s.recommended, card, 'Nothing new in the top right now. Press "Check now", or look at the rest below.');
  clear($('showRest'));
  $('showRest').appendChild(document.createTextNode(showRest ? 'Hide the rest' : 'Show the rest (' + s.rest.length + ' more books from the last ' + s.restDays + ' days)'));
  $('restBlock').style.display = showRest ? '' : 'none';
  clear($('restTitle'));
  $('restTitle').appendChild(document.createTextNode('The rest of the last ' + s.restDays + ' days'));
  if (showRest) fill($('rest'), s.rest, card, 'No other books.');
}

var STATUS = {
  tosend: 'Waiting books, in the order you added them. "Read in iBooks" gets the EPUB file (on the iPad choose "Open in iBooks") and moves the book to "Reading". Come back to this page for the next book.',
  reading: 'Books sent to iBooks, newest first. Give your answer after reading: a Dislike here counts more than a Dislike on a card you never read.',
  liked: 'Your Likes, newest first. You can change or clear any answer; a cleared book goes back to where it was.',
  disliked: 'Your Dislikes, newest first. You can change or clear any answer; a cleared book goes back to where it was.'
};

function load() {
  if (view !== 'home') {
    api('/api/list/' + view, null, function (err, data) {
      clear($('listStatus'));
      if (err) {
        $('listStatus').appendChild(document.createTextNode('The server does not answer. Is "npm start" running?'));
        return;
      }
      var y = window.pageYOffset || 0;
      $('listStatus').appendChild(document.createTextNode(STATUS[view]));
      fill($('list'), data.books, LISTS[view].make, LISTS[view].empty);
      showCounts(data.counts);
      window.scrollTo(0, y);
      // while EPUB files are being prepared, look again every few seconds
      wasBusy = false;
      for (var i = 0; i < data.books.length; i++) if (data.books[i].epub === 'preparing') wasBusy = true;
    });
    return;
  }
  api('/api/state', null, function (err, s) {
    if (err) {
      clear($('busy'));
      $('busy').appendChild(document.createTextNode('The server does not answer. Is "npm start" running?'));
      return;
    }
    var y = window.pageYOffset || 0;
    render(s);
    window.scrollTo(0, y);
    wasBusy = !!s.busy;
  });
}

$('nav_' + view).className = 'btn here';
if (view !== 'home') {
  document.title = LISTS[view].title;
  clear($('heading'));
  $('heading').appendChild(document.createTextNode(LISTS[view].title));
  $('homeView').style.display = 'none';
  $('listView').style.display = '';
  $('check').style.display = 'none';
}

$('addAll').onclick = function () {
  var keys = [];
  for (var i = 0; i < shown.length; i++) keys.push(shown[i].key);
  if (!keys.length || !confirm('Add all ' + keys.length + ' recommended books to the send list?')) return;
  $('addAll').disabled = true;
  api('/api/tosend', { keys: keys }, function (err) {
    if (err) alert('Could not add the books: ' + err.message);
    load();
  });
};
$('check').onclick = function () {
  $('check').disabled = true;
  api('/api/check', {}, function () {
    load();
  });
};
$('showRest').onclick = function () {
  showRest = !showRest;
  load();
};
$('top').onchange = function () {
  api('/api/settings', { top: Number($('top').value) }, function (err) {
    if (err) alert(err.message);
    load();
  });
};

load();
// coming back from iBooks or with the Back button: show fresh data
window.addEventListener('pageshow', function (e) {
  if (e.persisted) load();
}, false);
// while the server is working, look again every few seconds; otherwise once a minute
setInterval(function () {
  if (wasBusy) load();
}, 4000);
setInterval(load, 60000);
</script>
</body>
</html>
